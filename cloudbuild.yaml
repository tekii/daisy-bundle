# generate VERSION file
- name: ${_PYIMAGE}
  entrypoint: python
  args: 
  - 'generate_build_version.py'
  - '${SHORT_SHA}'
  dir: ${_BUILD_ROOT}
  
# build the package
- name: ${_PYIMAGE}
  entrypoint: python
  args:
  - '-m'
  - 'build'
  dir: ${_BUILD_ROOT}

artifacts:
  # support python metadata version up to 2.2 (setuptools<77.0.1)
  pythonPackages:
  - repository: 'https://$LOCATION-python.pkg.dev/$PROJECT_ID/margot'
    paths: ['${_BUILD_ROOT}/dist/*']

substitutions:
  _PYIMAGE: 'python:3.12'
  _BUILD_ROOT: toolbox_root


