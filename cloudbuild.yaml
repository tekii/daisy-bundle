
steps:
- name: ${_PYIMAGE}
  entrypoint: 'python'
  args: 
  - '-m'
  - 'pip'
  - 'install'
  - '--progress-bar'
  - 'off'
  - '--root-user-action'
  - 'ignore'
  - '--no-warn-script-location'
  - '--user' # this prevent losing the upgrade between steps
  - '--upgrade'
  - 'pip'
  - 'build'
  dir: ${_BUILD_ROOT}

