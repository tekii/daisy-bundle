
steps:
- name: ${_PYIMAGE}
  entrypoint: 'python'
  args: 
  - '-m'
  - 'pip'
  - 'install'
  - '--progress-bar'
  - 'off'
  - '--root-user-action'
  - 'ignore'
  - '--no-warn-script-location'
  - '--user' # this prevent losing the upgrade between steps
  - '--upgrade'
  - 'pip'
#  - 'pkginfo'
  dir: ${_BUILD_ROOT}

# install the necesaries dep to run the test before install the build deps ¿best practice?
#- name: 'python'
#  entrypoint: 'python'
#  args: ['-m', 'pytest', '--junitxml=${SHORT_SHA}_test_log.xml']

# install build and twine 
- name: ${_PYIMAGE}
  entrypoint: pip
  args: 
  - "install"
  - '--progress-bar'
  - 'off'
  - '--root-user-action'
  - 'ignore'
  - '--no-warn-script-location'
  - '--user' # this prevent losing the upgrade between steps
  - '-r'
  - 'requirements_build.txt'
  dir: ${_BUILD_ROOT}

# generate VERSION file
- name: ${_PYIMAGE}
  entrypoint: python
  args: 
  - 'build_version.py'
  - '${SHORT_SHA}'
  dir: ${_BUILD_ROOT}
  
# build the package
- name: ${_PYIMAGE}
  entrypoint: python
  args:
  - '-m'
  - 'build'
  dir: ${_BUILD_ROOT}

