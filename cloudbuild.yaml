# fails because soma allegedly lost metadata
artifacts:
  pythonPackages:
  - repository: 'https://$LOCATION-python.pkg.dev/$PROJECT_ID/margot'
    paths: ['${_BUILD_ROOT}/dist/*'] #replace the wildcard w/ the actual filename

substitutions:
  _PYIMAGE: 'python:3.12'
  _BUILD_ROOT: toolbox_root

