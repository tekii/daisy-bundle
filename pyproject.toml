[project]
name = "tekii-margot-toolbox"
description = "TEKii - MARGOT common code"
readme = "README"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Private :: Do Not Upload",
]
requires-python = ">= 3.0.0"
dynamic = ["version"]

[build-system]
requires = ["setuptools>=78", "setuptools-git-versioning>=2.0,<3",]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true
tag_filter =    "toolbox/(?P<tag>\\d+)"
tag_formatter = "toolbox/(?P<tag>\\d+)"
template       = "{tag}.post{ccount}"
dev_template   = "{tag}.post{ccount}+{sha}+dev"
dirty_template = "{tag}.post{ccount}+{sha}+dirty"
