[project]
name = "tekii-margot-toolbox"
description = "TEKii - MARGOT common code"
readme = "README"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Private :: Do Not Upload",
]
requires-python = ">= 3.0.0"
dynamic = [ "version", "dependencies", ]

[build-system]
# artifact support up to 2.2 metadata version
requires = ["setuptools>=76,<77.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "VERSION"}
dependencies = {file = "requirements.txt"}

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [ "--cov=src", ]
pythonpath = "src"
testpaths = [ "tests", ]

[tool.coverage.run]
omit = ["generate_build_version.py"]

[tool.isort]
profile = "black"
src_paths = "src"
skip = [".gitignore", ".dockerignore"]
extend_skip_glob = ["tests/*"]
