[project]
name = "tekii-margot-bundle"
description = "TEKii - MARGOT common code and tools"
readme = "README"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Private :: Do Not Upload",
]
requires-python = ">= 3.0.0"
dynamic = [ "version", "dependencies", ]

[project.scripts]
tekii_build_version = "tekii.margot.build_version:__main__"

[build-system]
# artifact support up to 2.2 metadata version
requires = ["setuptools>=76,<77.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "VERSION"}
dependencies = {file = "requirements.txt"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tekii.margot.*"]  
# exclude = ["additional*"]
namespaces = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [ "--cov=src", ]
pythonpath = "src"
testpaths = [ "tests", ]
consider_namespace_packages = true

[tool.coverage.run]
omit = ["tests/**"]

[tool.isort]
profile = "black"
src_paths = "src"
skip = [".gitignore", ".dockerignore"]
extend_skip_glob = ["tests/*"]
#namespace_packages = ["tekii.margot"]

#[[tool.mypy.overrides]]
#module = ["tekii.margot.bundle.*"]
#ignore_missing_imports = true